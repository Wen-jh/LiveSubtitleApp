name: Build Android APK
on:
  push:
    branches: [ main ]  # 推送到main分支自动触发
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # 允许手动触发（Actions页面点Run workflow）

jobs:
  build:
    runs-on: ubuntu-latest  # 云端用Ubuntu环境
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置JDK 17（Android官方推荐）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # 缓存Gradle依赖，加速构建

      # 3. 授予gradlew执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 构建Debug APK（无需签名，直接可用）
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 构建并签名Release APK（需要配置Secrets）
      - name: Build & Sign Release APK
        if: github.event_name != 'pull_request'  # PR不构建正式版
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 6. 上传APK到GitHub Actions（可下载）
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
