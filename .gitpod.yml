# GitPod 配置 - 编译 Android APK
image: gitpod/workspace-full

tasks:
  - name: Setup Android SDK
    init: |
      # 安装 Android SDK
      echo "安装 Android SDK..."
      sudo apt-get update
      sudo apt-get install -y wget unzip
      
      # 下载 Android SDK command-line tools
      ANDROID_SDK_ROOT=/opt/android-sdk
      sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
      cd /tmp
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
      sudo unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
      sudo mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
      
      # 设置环境变量
      echo "export ANDROID_SDK_ROOT=/opt/android-sdk" >> ~/.bashrc
      echo "export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> ~/.bashrc
      export ANDROID_SDK_ROOT=/opt/android-sdk
      export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
      
      # 接受许可证并安装必要组件
      yes | sdkmanager --licenses
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      echo "Android SDK 安装完成！"
  
  - name: Build APK
    init: |
      echo "等待 Android SDK 安装完成后，运行："
      echo "./gradlew assembleDebug"
    command: |
      export ANDROID_SDK_ROOT=/opt/android-sdk
      export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
      ./gradlew assembleDebug

vscode:
  extensions:
    - mathiasfrohlich.Kotlin
